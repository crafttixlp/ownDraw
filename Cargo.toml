[workspace]
resolver = "2"
members = ["crates/owndraw-core", "crates/owndraw", "crates/owndraw-android", "crates/owndraw-web", "crates/owndraw-server"]
# owndraw-android ist nur für das Android-Ziel sinnvoll (siehe docs/android.md),
# owndraw-web nur für wasm32-unknown-unknown (siehe docs/web.md, build-web.sh).
default-members = ["crates/owndraw-core", "crates/owndraw", "crates/owndraw-server"]

[workspace.package]
version = "4.40.1"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Browser-Build (build-web.sh): wie release, aber ohne `strip = true`, damit wasm-bindgen die
# Wasm-Features (Abschnitt target_features) sieht.
[profile.web]
inherits = "release"
strip = "debuginfo"
