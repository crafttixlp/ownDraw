[workspace]
resolver = "2"
members = ["crates/owndraw-core", "crates/owndraw", "crates/owndraw-android"]
# owndraw-android ist nur für das Android-Ziel sinnvoll (siehe docs/android.md).
default-members = ["crates/owndraw-core", "crates/owndraw"]

[workspace.package]
version = "3.0.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
