[package]
name = "owndraw-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OwnDraw-Kern: Board-Modell, Formerkennung, Rendering, Ablage und Export"

[dependencies]
tiny-skia = { version = "0.12", default-features = false, features = ["std", "png-format"] }
ttf-parser = "0.25"
epaint_default_fonts = { version = "0.37", features = ["monochrome_emoji_fonts"] }
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
miniz_oxide = "0.9"
sha2 = "0.10"
roxmltree = "0.20"
flate2 = "1"

# SIMD nur außerhalb des Browsers (WebAssembly ohne simd128-Ziel)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tiny-skia = { version = "0.12", default-features = false, features = ["simd"] }

# Browser (WebAssembly): Uhr und Zufall über JavaScript (std::time paniken dort)
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1"
js-sys = "0.3"
