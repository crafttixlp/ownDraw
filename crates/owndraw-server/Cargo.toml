[package]
name = "owndraw-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OwnDraw Web-Server: Konten, Lizenzen, Boards, Admin-Panel, Self-Update"

[lib]
name = "owndraw_server"
path = "src/lib.rs"

[[bin]]
name = "owndraw-server"
path = "src/main.rs"

[dependencies]
argon2 = "0.6.0"
axum = "0.8.9"
flate2 = "1.1.11"
getrandom = "0.4.3"
hex = "0.4.3"
minisign-verify = "0.3.0"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs", "compression-gzip", "compression-br", "limit"] }
uuid = { version = "1.29.2", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = "0.5.3"
