<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Apps herunterladen · OwnDraw</title>
<link rel="icon" type="image/png" href="/owndraw.png">
<style>
  :root { --bg: #f6f6f8; --card: #ffffff; --line: #e2e2e8; --text: #17171c; --muted: #6b6b78; --accent: #5b5bf0; --on-accent: #ffffff; --code: #efeff3; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111114; --card: #18181c; --line: #2a2a31; --text: #ececf1; --muted: #9a9aa8; --accent: #7c7cff; --on-accent: #111116; --code: #222228; } }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Ubuntu, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 32px 16px 48px; box-sizing: border-box; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  header img { width: 40px; height: 40px; border-radius: 10px; }
  h1 { font-size: 1.5rem; margin: 0; }
  .intro { color: var(--muted); margin: 0 0 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; min-width: 0; }
  h2 { font-size: 1.15rem; margin: 0; }
  .sub { color: var(--muted); font-size: .9rem; margin: 2px 0 16px; }
  .btn { display: inline-block; background: var(--accent); color: var(--on-accent); text-decoration: none; font-weight: 600; padding: 10px 18px; border-radius: 10px; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .meta { margin: 12px 0 4px; font-size: .9rem; }
  .hash { margin: 0 0 12px; font-size: .78rem; color: var(--muted); }
  .hash span { display: block; }
  code { font: .85em ui-monospace, "SF Mono", Consolas, monospace; background: var(--code); border-radius: 4px; padding: 1px 4px; overflow-wrap: anywhere; }
  ol { margin: 0; padding-left: 1.3em; font-size: .92rem; }
  li { margin: 4px 0; }
  .na { color: var(--muted); margin: 0; }
  footer { margin-top: 24px; font-size: .9rem; color: var(--muted); }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <header><img src="/owndraw.png" alt=""><h1>Apps herunterladen</h1></header>
  <p class="intro">OwnDraw gibt es auch als App für Android und Linux.</p>
  <div class="grid">__CARDS__</div>
  <footer>Prüfsumme kontrollieren: <code>sha256sum &lt;Datei&gt;</code> · <a href="/">Zur Web-App</a></footer>
</main>
</body>
</html>
