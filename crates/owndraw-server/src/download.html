<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Apps herunterladen · OwnDraw</title>
<link rel="icon" type="image/png" href="/owndraw.png">
<style>
/* === OwnDraw Design-Tokens (in allen Oberflächen identisch) === */
:root {
  color-scheme: light dark;
  --bg: #f6f6f8; --surface: #ffffff; --surface-2: #eeeef2; --line: #e2e2e8; --text: #17171c; --muted: #6b6b78;
  --accent: #5b5bf0; --on-accent: #ffffff; --accent-soft: #ebebfe;
  --danger: #d93f3f; --ok: #1f9d5a; --warn: #b8730b;
  --hover: rgba(0,0,0,.05); --overlay: rgba(10,10,16,.45);
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
  --r-sm: 8px; --r: 12px; --r-lg: 16px;
  --shadow-1: 0 1px 2px rgba(20,20,40,.06); --shadow-2: 0 8px 28px rgba(20,20,40,.14);
  --fs-xs: .75rem; --fs-sm: .875rem; --fs-md: 1rem; --fs-lg: 1.25rem; --fs-xl: 1.625rem;
  --font: system-ui, -apple-system, "Segoe UI", Ubuntu, Roboto, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --tap: 40px;
  --focus: 2px solid var(--accent);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111114; --surface: #18181c; --surface-2: #0c0c0f; --line: #2a2a31; --text: #ececf1; --muted: #9a9aa8;
    --accent: #7c7cff; --on-accent: #111116; --accent-soft: #23233a;
    --danger: #ff8484; --ok: #3ccb7f; --warn: #e0a23a;
    --hover: rgba(255,255,255,.06); --overlay: rgba(0,0,0,.6);
    --shadow-1: 0 1px 2px rgba(0,0,0,.4); --shadow-2: 0 8px 28px rgba(0,0,0,.5);
  }
}
@media (pointer: coarse) { :root { --tap: 44px; } }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: var(--fs-md)/1.5 var(--font); -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased; }
:focus-visible { outline: var(--focus); outline-offset: 2px; }
a { color: var(--accent); }
header { border-bottom: 1px solid var(--line); background: var(--surface); }
header .bar { max-width: 860px; margin: 0 auto; display: flex; align-items: center; gap: var(--s3); padding: var(--s3) var(--s4); }
.brand { display: flex; align-items: center; gap: var(--s3); flex: 1; min-width: 0; font-weight: 600; letter-spacing: -.01em; }
.brand img { width: 32px; height: 32px; border-radius: var(--r-sm); display: block; }
.back { display: inline-flex; align-items: center; min-height: var(--tap); padding: 0 var(--s3); border-radius: var(--r-sm); color: var(--muted); font-size: var(--fs-sm); font-weight: 500; text-decoration: none; white-space: nowrap; }
.back:hover { background: var(--hover); color: var(--text); }
main { max-width: 860px; margin: 0 auto; padding: var(--s6) var(--s4) calc(var(--s6) * 1.5); }
h1 { font-size: var(--fs-xl); line-height: 1.2; letter-spacing: -.02em; margin: 0 0 var(--s1); }
.intro { color: var(--muted); margin: 0 0 var(--s5); }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: var(--s4); align-items: start; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: var(--s5); min-width: 0; box-shadow: var(--shadow-1); }
h2 { font-size: var(--fs-lg); margin: 0; letter-spacing: -.01em; }
.sub { color: var(--muted); font-size: var(--fs-sm); margin: 2px 0 var(--s4); }
.btn { display: flex; align-items: center; justify-content: center; min-height: var(--tap); padding: 0 var(--s4); background: var(--accent); color: var(--on-accent); text-decoration: none; font-weight: 600; border-radius: var(--r-sm); transition: filter .15s; }
.btn:hover { filter: brightness(1.08); }
.meta { margin: var(--s3) 0 var(--s1); font-size: var(--fs-sm); }
.hash { margin: 0 0 var(--s4); font-size: var(--fs-xs); color: var(--muted); }
.hash span { display: block; margin-bottom: 2px; }
.hash code { display: block; }
code { font: .85em var(--mono); background: var(--surface-2); border-radius: 6px; padding: 2px 6px; overflow-wrap: anywhere; }
ol { margin: 0; padding: var(--s4) 0 0; border-top: 1px solid var(--line); font-size: var(--fs-sm); list-style: none; counter-reset: schritt; }
ol::before { content: "So installierst du"; display: block; margin-bottom: var(--s2); color: var(--muted); font-size: var(--fs-xs); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
li { position: relative; margin: 0 0 var(--s3); padding-left: 32px; counter-increment: schritt; }
li:last-child { margin-bottom: 0; }
li::before { content: counter(schritt); position: absolute; left: 0; top: 1px; width: 22px; height: 22px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: var(--fs-xs); font-weight: 600; display: grid; place-items: center; }
.na { color: var(--muted); margin: 0; padding: var(--s4); text-align: center; border: 1px dashed var(--line); border-radius: var(--r-sm); font-size: var(--fs-sm); }
footer { margin-top: var(--s5); font-size: var(--fs-sm); color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media (max-width: 560px) { main { padding-top: var(--s5); } .card { padding: var(--s4); } h1 { font-size: var(--fs-lg); } }
</style>
</head>
<body>
<header><div class="bar"><div class="brand"><img src="/owndraw.png" alt="">OwnDraw</div><a class="back" href="/">Zur Web-App</a></div></header>
<main>
  <h1>Apps herunterladen</h1>
  <p class="intro">OwnDraw gibt es auch als App für Android und Linux.</p>
  <div class="grid">__CARDS__</div>
  <footer>Du willst sichergehen, dass die Datei echt ist? Vergleiche die Prüfsumme mit <code>sha256sum &lt;Datei&gt;</code>.</footer>
</main>
</body>
</html>
