<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>OwnDraw – Wartung</title>
<link rel="icon" type="image/png" href="/owndraw.png">
<style>
  :root { --bg: #f4f4f6; --panel: #ffffff; --text: #303138; --muted: #6a6d78; --accent: #5b6cff; --line: #dfe1e7; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1c1d22; --panel: #25262d; --text: #e9eaee; --muted: #a4a7b3; --accent: #8a96ff; --line: #363844; } }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Ubuntu, sans-serif; }
  main { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; }
  .card { max-width: 30em; width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 28px 24px; text-align: center; }
  img { width: 64px; height: 64px; }
  h1 { font-size: 1.35rem; margin: 12px 0 8px; }
  p { margin: 8px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .muted { color: var(--muted); font-size: .9rem; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <div class="card" data-until="__UNTIL__">
    <img src="/owndraw.png" alt="">
    <h1>Wartungsarbeiten</h1>
    <p>__MESSAGE__</p>
    <p class="muted" id="bis" hidden></p>
    <p class="muted">Die Seite lädt automatisch neu, sobald OwnDraw wieder bereit ist.</p>
    <p class="muted"><a href="/admin">Admin-Anmeldung</a></p>
  </div>
</main>
<script>
  (() => {
    const until = Number(document.querySelector(".card").dataset.until);
    if (until > 0) {
      const bis = document.getElementById("bis");
      bis.textContent = "Voraussichtlich bis " + new Date(until * 1000).toLocaleString("de-AT", { dateStyle: "medium", timeStyle: "short" }) + ".";
      bis.hidden = false;
    }
    setInterval(async () => {
      try {
        const r = await fetch("/api/maintenance", { cache: "no-store" });
        const j = await r.json();
        if (!j.active) location.reload();
      } catch (e) { /* Server startet evtl. neu */ }
    }, 30000);
  })();
</script>
</body>
</html>
