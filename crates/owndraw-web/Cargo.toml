[package]
name = "owndraw-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OwnDraw im Browser (WebAssembly, eframe/egui), Gastmodus"
publish = false

[lib]
# Ergibt owndraw_web.js + owndraw_web_bg.wasm (Namen wie in docs/web-api.md, Abschnitt Auslieferung).
crate-type = ["cdylib"]
path = "src/lib.rs"

[target.'cfg(target_arch = "wasm32")'.dependencies]
owndraw = { path = "../owndraw" }
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement"] }
log = "0.4"
