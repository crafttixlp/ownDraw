[package]
name = "owndraw"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OwnDraw: Zeichen- und Whiteboard-App (Linux-Desktop)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "owndraw"
path = "src/main.rs"

[dependencies]
owndraw-core = { path = "../owndraw-core" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
egui = { version = "0.37", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }

# Update-Dienst (WP11), nicht im Browser
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
semver = "1"
minisign-verify = "0.2"

# Desktop (Linux/Windows/macOS)
[target.'cfg(not(any(target_os = "android", target_arch = "wasm32")))'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "x11", "wayland", "default_fonts"] }
open = "5"
rfd = "0.18"
arboard = { version = "3", features = ["image-data", "wayland-data-control"] }
pollster = "0.4"
dirs = "6"
# Netzwerk auf dem Desktop (Android lädt über die Java-Seite, siehe platform/android.rs)
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
flate2 = "1"
tar = { version = "0.4", default-features = false }
# Live-Zusammenarbeit am Desktop (WebSocket zum OwnDraw-Server, TLS wie ureq über rustls + System-Zertifikate)
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"

# Android (WP5): eframe mit NativeActivity, JNI für SAF/Zwischenablage
[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "android-native-activity"] }
android-activity = { version = "0.6", features = ["native-activity"] }
jni = "0.21"
ndk-context = "0.1"
log = "0.4"

# Browser (WebAssembly, Gastmodus): eframe-Web-Backend (WebGL über glow), Dateien über <input>/Download
[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlAnchorElement", "HtmlCanvasElement", "FileList", "File", "Blob", "BlobPropertyBag", "Url", "Storage", "Event", "EventTarget", "BeforeUnloadEvent", "ClipboardEvent", "DataTransfer", "DataTransferItem", "DataTransferItemList", "Navigator", "IdbFactory", "IdbDatabase", "IdbOpenDbRequest", "IdbRequest", "IdbObjectStore", "IdbTransaction", "IdbTransactionMode", "IdbCursorWithValue", "IdbVersionChangeEvent", "CssStyleDeclaration", "Location", "History", "MouseEvent", "DragEvent", "MediaQueryList", "DomStringList", "console", "Request", "RequestInit", "RequestCredentials", "Response", "Headers", "WebSocket", "MessageEvent", "CloseEvent",
  # Software-Darstellung ohne WebGL (platform/web/soft)
  "CanvasRenderingContext2d", "ImageData", "TextMetrics", "PointerEvent", "KeyboardEvent", "WheelEvent", "TouchEvent", "TouchList", "Touch", "CompositionEvent", "InputEvent", "FocusOptions", "AddEventListenerOptions", "ResizeObserver", "ResizeObserverEntry", "ResizeObserverSize", "ResizeObserverOptions", "ResizeObserverBoxOptions", "DomRect", "Node", "ShadowRoot", "Performance", "MediaQueryListEvent", "Clipboard", "ClipboardItem", "EventListener", "FocusEvent"] }
send_wrapper = "0.6"
log = "0.4"

[dev-dependencies]
minisign = "0.7"
tiny_http = "0.12"
tempfile = "3"
