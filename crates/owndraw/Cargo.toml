[package]
name = "owndraw"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OwnDraw: Zeichen- und Whiteboard-App (Linux-Desktop)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "owndraw"
path = "src/main.rs"

[dependencies]
owndraw-core = { path = "../owndraw-core" }
eframe = { version = "0.37", default-features = false, features = ["glow", "x11", "wayland", "default_fonts"] }
egui-file-dialog = "0.16"
open = "5"
egui = { version = "0.37", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.18"
arboard = { version = "3", features = ["image-data", "wayland-data-control"] }
pollster = "0.4"
dirs = "6"
