[package]
name = "owndraw"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OwnDraw: Zeichen- und Whiteboard-App (Linux-Desktop)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "owndraw"
path = "src/main.rs"

[dependencies]
egui-file-dialog = "0.16"
open = "5"
owndraw-core = { path = "../owndraw-core" }
egui = { version = "0.37", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Desktop (Linux/Windows/macOS)
[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "x11", "wayland", "default_fonts"] }

# Android (WP5): eframe mit NativeActivity, JNI für SAF/Zwischenablage
[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "android-native-activity"] }
android-activity = { version = "0.6", features = ["native-activity"] }
jni = "0.21"
ndk-context = "0.1"
log = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
